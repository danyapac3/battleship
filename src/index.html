<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="ship-placement-screen">
      <div class="ship-placement-screen__board board"></div>
      <div class="ship-placement-screen__ships-list"></div>
      <div class="ship-placement-screen__buttons">
        <button class="ship-placement-screen__randomize-button">
          Randomize
        </button>
        <button class="ship-placement-screen__ready-button">Ready</button>
      </div>
    </div>
    <div class="game-screen" hidden>
      <div class="board player-board"></div>
      <div class="board enemy-board"></div>
    </div>
    <div class="popups">
      <dialog class="popup" id="pass-device-to-opponent">
        <div class="popup__text">
          Pass your device to opponent and press ok button
        </div>
        <button class="popup__ok-button">ok</button>
      </dialog>
      <dialog class="popup" id="game-over">
        <div class="popup__text"></div>
        <button class="popup__ok-button">ok</button>
      </dialog>
    </div>
  </body>
</html>
